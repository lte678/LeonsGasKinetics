name = "Couette"
meshfile = "couette_mesh.h5"

[timestep]
tend = 0.1
dt = 5e-4

[output]
sample_fraction = 0.8

[dsmc]
collision_operator = "bgk"
mpf = 1e14

[denoise]
enabled = true
T_ref = 280.0
n_ref = 1.3e18

[species.argon]
T_ref = 273.0
d_ref = 4.05e-10
mass = 6.63e-26
omega = 0.27

[[initialization]]
species = "argon"
density = 1.3e18
temperature = 280.0

[[boundary]]
identifier = "BC_SYM"
type = "symmetric"

[[boundary]]
identifier = "BC_XPLUS"
type = "diffuse"
accommodation = 1.0
temperature = 280.0
velocity = [0.0, 1.0, 0.0]

[[boundary]]
identifier = "BC_XMINUS"
type = "diffuse"
accommodation = 1.0
temperature = 280.0
velocity = [0.0, -1.0, 0.0]

