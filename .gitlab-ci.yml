stages:
  - test
  - analyze

variables:
  # Keep Julia packages in the project directory for caching
  JULIA_DEPOT_PATH: "$CI_PROJECT_DIR/.julia"
  JULIA_COLOR: "yes"
  JULIA_NUM_THREADS: "4"

# Cache the Julia depot between pipeline runs to speed up builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .julia/compiled/
    - .julia/packages/
    - .julia/artifacts/
    - .julia/registries/
  policy: pull-push

test:
  stage: test
  image: julia:1.12
  
  before_script:
    # Install system dependencies if needed (e.g., for HDF5)
    #- apt-get update -qq && apt-get install -y -qq hdf5-tools || true
    - apt-get update -qq && apt-get install -y -qq likwid || true
    
    # Instantiate the project (install dependencies)
    - julia --project=@. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
  
  script:
    # Run the test suite (executes test/runtests.jl)
    # - julia --project=@. -e 'using Pkg; Pkg.test(; coverage=true)'
    # NOTE: Coverage has a very large performance impact.
    - julia --project=@. -e 'using Pkg; Pkg.add("TestReports"); using TestReports; TestReports.test()'
  artifacts:
    reports:
      junit: testlog.xml
    when: always

benchmark:
  stage: analyze
  image: julia:1.12
 
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 || true
    # Instantiate the project (install dependencies)
    - julia --project=@. -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
  script:
    # Run benchmark
    - julia -t4 --project=. src/main.jl test/benchmarks/thermal_cavity_benchmark.toml /tmp/lgk_output --times > output.log
    # Parse the results using the Python script
    - python3 test/benchmarks/output_to_junit.py output.log
  artifacts:
    reports:
      junit: benchmark_report.xml
    when: always
